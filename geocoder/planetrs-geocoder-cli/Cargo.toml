[package]
name = "planetrs-geocoder-cli"
description = "The planetrs-geocoder command: a coordinate for every site of a file, from OpenStreetMap data alone"
documentation = "https://docs.rs/planetrs-geocoder-cli"
readme = "../README.md"
keywords = ["geocoding", "geocoder", "openstreetmap", "address", "cli"]
categories = ["command-line-utilities", "science::geo"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[lib]
name = "planetrs_geocoder_cli"
path = "src/lib.rs"

[[bin]]
name = "planetrs-geocoder"
path = "src/main.rs"
doc = false

[dependencies]
planetrs-cli.workspace = true
planetrs-dataset = { workspace = true, features = ["remote"] }
planetrs-geocoder.workspace = true
anyhow.workspace = true
clap.workspace = true
thiserror.workspace = true

[dev-dependencies]
planetrs-dataset = { workspace = true, features = ["testing"] }
planetrs-pbf = { workspace = true, features = ["testing"] }

[lints]
workspace = true
