name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  draft:
    name: Draft the release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Take the notes from the changelog
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v heading="## [$version]" '
            index($0, heading) == 1 { keep = 1; next }
            keep && /^## \[/ { exit }
            keep && /^\[[0-9]/ { exit }
            keep { print }
          ' CHANGELOG.md > notes.md
          test -s notes.md || echo "See CHANGELOG.md." > notes.md
          cat notes.md
      - name: Create it as a draft
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --draft --verify-tag --title "$GITHUB_REF_NAME" --notes-file notes.md

  build:
    name: Build for ${{ matrix.target }}
    needs: draft
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-15
          - target: x86_64-apple-darwin
            os: macos-15-intel
          - target: x86_64-unknown-linux-musl
            os: ubuntu-24.04
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - name: Install the musl C toolchain ring needs
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes musl-tools
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-about
      - name: Build both commands
        run: >
          cargo build --locked --profile dist --target ${{ matrix.target }}
          -p planetrs-geocoder-cli -p planetrs-mapclipper-cli
      - name: List the third-party licences
        run: cargo about generate --workspace --locked about.hbs -o THIRD-PARTY-LICENSES.html
      - name: Pack each command with its licences
        shell: bash
        run: |
          for command in planetrs-geocoder planetrs-mapclipper; do
            folder="$command-${{ matrix.target }}"
            mkdir "$folder"
            cp "target/${{ matrix.target }}/dist/$command" LICENSE README.md THIRD-PARTY-LICENSES.html "$folder/"
            "$folder/$command" --version
            tar -czf "$folder.tar.gz" "$folder"
            shasum -a 256 "$folder.tar.gz" > "$folder.tar.gz.sha256"
          done
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: github.event_name == 'push'
        with:
          subject-path: "*.tar.gz"
      - name: Attach the archives to the draft
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" *.tar.gz *.tar.gz.sha256 --clobber
      - name: Keep the archives of a trial run
        if: github.event_name != 'push'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: planetrs-${{ matrix.target }}
          path: |
            *.tar.gz
            *.tar.gz.sha256

  publish:
    name: Publish the release
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false
