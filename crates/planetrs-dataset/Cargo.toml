[package]
name = "planetrs-dataset"
version.workspace = true
description = "The planetrs dataset: a manifest, a planet-wide gazetteer, a geocoder index per country and a tiled map index, all GeoParquet, built and read on one machine"
documentation = "https://docs.rs/planetrs-dataset"
readme = "README.md"
keywords = ["openstreetmap", "geoparquet", "parquet", "geocoding", "dataset"]
categories = ["science::geo", "parser-implementations", "encoding"]
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[features]
# The fake files, the range server and the contract every way of reading files honours, for tests.
testing = []

[dependencies]
arrow-array.workspace = true
arrow-schema.workspace = true
bytes.workspace = true
parquet.workspace = true
rayon.workspace = true
planetrs-geo.workspace = true
planetrs-pbf.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true

[dev-dependencies]
planetrs-dataset = { path = ".", features = ["testing"] }

[lints]
workspace = true
