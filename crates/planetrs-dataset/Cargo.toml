[package]
name = "planetrs-dataset"
version.workspace = true
description = "The planetrs dataset: a manifest, a planet-wide gazetteer and per-country GeoParquet indexes, read locally or over HTTP"
documentation = "https://docs.rs/planetrs-dataset"
readme = "README.md"
keywords = ["openstreetmap", "geoparquet", "parquet", "geocoding", "dataset"]
categories = ["science::geo", "parser-implementations", "encoding"]
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[features]
# Reading a published dataset over HTTP range requests.
remote = ["dep:ureq"]
# The fake files, the range server and the contract every way of reading files honours, for tests.
testing = []

[dependencies]
arrow-array.workspace = true
arrow-schema.workspace = true
bytes.workspace = true
parquet.workspace = true
planetrs-geo.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
ureq = { workspace = true, optional = true }

[dev-dependencies]
planetrs-dataset = { path = ".", features = ["remote", "testing"] }

[lints]
workspace = true
