[workspace]
resolver = "3"
members = [
    "crates/planetrs-pbf",
    "crates/planetrs-geo",
    "crates/planetrs-dataset",
    "crates/planetrs-cli",
    "geocoder/planetrs-geocoder",
    "geocoder/planetrs-geocoder-cli",
    "mapclipper/planetrs-mapclipper",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/maeevick/planetrs"
homepage = "https://github.com/maeevick/planetrs"

[workspace.dependencies]
planetrs-pbf = { path = "crates/planetrs-pbf", version = "0.1.0" }
planetrs-geo = { path = "crates/planetrs-geo", version = "0.1.0" }
planetrs-dataset = { path = "crates/planetrs-dataset", version = "0.1.0" }
planetrs-cli = { path = "crates/planetrs-cli", version = "0.1.0" }
planetrs-geocoder = { path = "geocoder/planetrs-geocoder", version = "0.1.0" }
flate2 = { version = "1.1", default-features = false, features = ["zlib-rs"] }
rayon = "1.12"
thiserror = "2"
anyhow = "1"
clap = { version = "4.6.7", features = ["derive"] }
ureq = { version = "3.4", default-features = false, features = ["rustls"] }
md-5 = "0.11"
fs4 = "1.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
parquet = { version = "60", default-features = false, features = ["arrow", "flate2-zlib-rs"] }
arrow-array = "60"
arrow-schema = "60"
bytes = "1"
sha2 = "0.11"

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"

[profile.dist]
inherits = "release"
strip = true
